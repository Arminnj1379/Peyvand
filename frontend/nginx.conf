# SPA + reverse proxy. Same origin for the web app, the API, and SignalR
# (avoids CORS in production; the dev Vite origin stays in appsettings).
upstream api {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    # Security headers (TLS terminates here or at an outer proxy — see deployment docs).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API + auth + uploads (large bodies for video attachments).
    # NOTE: no trailing slash on proxy_pass — the API routes include the
    # /api prefix, so the original URI must be forwarded unchanged.
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 110m;
        proxy_read_timeout 120s;
    }

    # SignalR hub (WebSockets + fallback transports). Same rule: keep /hubs.
    location /hubs/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Health (load-balancer checks hit the API through here).
    location = /healthz {
        proxy_pass http://api/healthz;
    }
    location = /readyz {
        proxy_pass http://api/readyz;
    }
    location = /health/storage {
        proxy_pass http://api/health/storage;
    }

    # Static SPA with client-side routing fallback.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
